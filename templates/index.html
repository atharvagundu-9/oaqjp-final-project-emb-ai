<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Detection</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Fraunces:opsz,wght@9..144,600&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <main class="app-shell">
      <section class="hero">
        <span class="eyebrow">WATSON NLP · EMOTION ANALYSIS</span>
        <h1>What does your text <em>feel</em> like?</h1>
        <p class="intro">Enter a statement and the AI will score five emotions, then identify the one expressed most strongly.</p>
      </section>

      <section class="analyzer-card" aria-label="Emotion analyzer">
        <label for="textToAnalyze">Text to analyze</label>
        <textarea id="textToAnalyze" rows="5" placeholder="Try: I am so happy about this wonderful news!"></textarea>
        <div class="card-actions">
          <span class="hint">English text · up to a few sentences</span>
          <button type="button" id="analyzeButton" onclick="runEmotionAnalysis()">
            Analyze emotion
            <span aria-hidden="true">→</span>
          </button>
        </div>
      </section>

      <section class="result-card" id="resultCard" aria-live="polite">
        <div class="result-heading">
          <span class="result-icon" aria-hidden="true">✦</span>
          <div>
            <span class="result-label">Analysis result</span>
            <p id="system_response">Your emotion analysis will appear here.</p>
          </div>
        </div>
      </section>
    </main>
    <script src="{{ url_for('static', filename='mywebscript.js') }}"></script>
  </body>
</html>
